<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiência Mobile First - Reportagem</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Special+Elite&display=swap');

        body, html { 
            margin: 0; padding: 0; 
            background: #000; 
            color: #fff;
            font-family: 'Courier Prime', monospace;
            height: 100%;
            overflow-x: hidden;
        }

        /* Efeito de ruído visual */
        .overlay-noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUic8S9mI97O9/giphy.gif');
            opacity: 0.05;
            pointer-events: none;
            z-index: 99;
        }

        /* Container Principal */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Ecrã Inicial */
        #gate-screen {
            text-align: center;
            z-index: 100;
        }

        .btn-warning {
            background: #f00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Special Elite', cursive;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px #f00;
        }

        /* Grid de Vídeo - Mobile First (Coluna única) */
        .video-grid {
            display: none;
            width: 100%;
            max-width: 1200px;
            gap: 15px;
            flex-direction: column; /* Mobile: Um por cima do outro */
        }

        /* Desktop: Lado a Lado */
        @media (min-width: 768px) {
            .video-grid {
                flex-direction: row; 
            }
        }

        .video-container {
            flex: 1;
            background: #050505;
            border: 1px solid #333;
            position: relative;
            aspect-ratio: 4/3;
            overflow: hidden;
        }

        .video-tag {
            position: absolute;
            top: 10px; left: 10px;
            background: #f00;
            font-size: 10px;
            padding: 3px 8px;
            z-index: 10;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #predator-video {
            filter: brightness(0.5) contrast(1.4) grayscale(0.5);
        }

        #user-webcam {
            transform: scaleX(-1);
            filter: sepia(0.2);
        }

        /* Caixa de Chat */
        .chat-ui {
            display: none;
            width: 100%;
            max-width: 600px;
            background: rgba(15, 0, 0, 0.9);
            border: 1px solid #f00;
            padding: 15px;
            margin-top: 20px;
            box-sizing: border-box;
        }

        /* Animação de Glitch Final */
        @keyframes horror-glitch {
            0% { transform: translate(0); }
            10% { transform: translate(-5px, 5px); background-color: #200; }
            20% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

<div class="overlay-noise"></div>

<div class="main-wrapper" id="horror-stage">
    
    <!-- PASSO 1: ENTRADA -->
    <div id="gate-screen">
        <h2 style="color: #f00; font-family: 'Special Elite';">AVISO DE SEGURANÇA</h2>
        <p style="opacity: 0.7;">Estás a entrar numa zona de chat não moderada.</p>
        <button class="btn-warning" onclick="startExperience()">Aceitar e Ligar Câmara</button>
    </div>

    <!-- PASSO 2: INTERFACE DE VÍDEO -->
    <div class="video-grid" id="video-interface">
        
        <!-- ESQUERDA: WEBCAM DO UTILIZADOR -->
        <div class="video-container">
            <div class="video-tag">TU (CONVIDADO)</div>
            <video id="user-webcam" autoplay playsinline muted></video>
        </div>

        <!-- DIREITA: VÍDEO DO HOMEM (Link IOL) -->
        <div class="video-container">
            <div class="video-tag">ESTRANHO_404 (LIVE)</div>
            <video id="predator-video" autoplay loop muted playsinline>
                <source src="https://www.iol.pt/videos-file/4/3/0/8/6a0212b50cf2d0ed34b84308-L-1000k.mp4" type="video/mp4">
                O teu navegador não suporta este vídeo.
            </video>
        </div>
    </div>

    <!-- PASSO 3: MENSAGENS -->
    <div class="chat-ui" id="chat-box">
        <div id="chat-text" style="color: #f00;">> Ligação estabelecida...</div>
    </div>

</div>

<script>
    function startExperience() {
        // Iniciar Webcam
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                var vUser = document.getElementById('user-webcam');
                vUser.srcObject = stream;
                vUser.play();
            })
            .catch(function(err) {
                console.log("Webcam bloqueada.");
            });
        }

        // Forçar play no vídeo do "Estranho"
        var vPredator = document.getElementById('predator-video');
        vPredator.play();

        // Alternar Ecrãs
        document.getElementById('gate-screen').style.display = 'none';
        document.getElementById('video-interface').style.display = 'flex';
        document.getElementById('chat-box').style.display = 'block';

        // Script de Mensagens
        const logs = [
            "> [Estranho]: Olá... finalmente alguém real.",
            "> [Estranho]: O que faz uma criança sozinha nestes sites?",
            "> [Estranho]: Não precisas de ter medo de mim.",
            "> [SISTEMA]: ALERTA - INVASÃO DE PRIVACIDADE DETETADA.",
            "> [Estranho]: Estás no teu quarto? Vou ter contigo agora."
        ];

        let count = 0;
        const target = document.getElementById('chat-text');
        
        const loop = setInterval(() => {
            if (count < logs.length) {
                target.innerHTML = logs[count];
                count++;

                if (count === logs.length) {
                    setTimeout(() => {
                        document.getElementById('horror-stage').style.animation = "horror-glitch 0.1s infinite";
                        target.innerHTML = "<span style='color:white'>ISTO É O QUE ACONTECE A MILHARES DE CRIANÇAS. O PERIGO É REAL.</span>";
                    }, 3000);
                }
            } else {
                clearInterval(loop);
            }
        }, 4000);
    }
</script>

</body>
</html>
